apiVersion: apps/v1
kind: Deployment
metadata:
  name: budget-book-api
  namespace: budget-book
spec:
  replicas: 1
  selector:
    matchLabels:
      app: budget-book-api
  template:
    metadata:
      labels:
        app: budget-book-api
    spec:
      containers:
        - name: api
          image: ghcr.io/choizeus02/budget-book-api:876af3f63f068f408165442ed7b01f8765bcaf32
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: budget-book-secret
          env:
            # datetime.now()/today()가 KST 기준으로 동작하도록 (월 경계 계산)
            - name: TZ
              value: Asia/Seoul
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: budget-book-api
  namespace: budget-book
spec:
  selector:
    app: budget-book-api
  ports:
    - port: 8000
      targetPort: 8000
